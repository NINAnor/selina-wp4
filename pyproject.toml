[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
  "deptry",
  "pytailwindcss>=0.2.0",
  "ty>=0.0.3"
]

[project]
authors = [
  {name = "ninanor", email = "ninanor@nina.no"}
]
# PEP 621 project metadata
# See https://www.python.org/dev/peps/pep-0621/
dependencies = [
  "django-environ",
  "pandoc>=2.4,<3",
  "fastapi[standard]>=0.125.0,<0.126",
  "mistune>=3.1.4",
  "structlog>=25.5.0,<26",
  "pyyaml>=6.0.3",
  "python-slugify>=8.0.4"
]
description = ""
license = "GPL-3.0+"
name = "selina_wp4"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.scripts]
selina_wp4 = "main:start"

[tool.pixi.dependencies]
pandoc = ">=3.8.3,<4"
pnpm = ">=10.28.0,<11"

[tool.pixi.environments]
default = {solve-group = "default"}
dev = {features = ["dev"], solve-group = "default"}

[tool.pixi.pypi-dependencies]
selina_wp4 = {path = ".", editable = true}

[tool.pixi.tasks]
dev = "uvicorn --reload selina_wp4.main:app --reload-dir ."
prod = "fastapi run src/selina_wp4/main.py"
theme = "npm run dev"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.ruff]
fix = true

[tool.ruff.lint]
ignore = ["COM812"]
select = ["E", "W", "I", "F", "UP", "S", "B", "A", "COM", "LOG", "PTH", "Q"]
